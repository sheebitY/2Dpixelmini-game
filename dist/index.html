<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel RPG</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
    #game-container {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    canvas { image-rendering: pixelated; }

    /* �T�T�T HUD overlay �T�T�T */
    #hud-overlay {
      position: absolute;
      top: 12px; left: 12px;
      z-index: 100;
      pointer-events: none;
      font-family: 'Courier New', monospace;
      display: flex; flex-direction: column; gap: 6px;
    }
    .hud-hp-section { display: flex; align-items: center; gap: 8px; }
    .hud-heart { font-size: 20px; filter: drop-shadow(0 0 4px rgba(255,50,50,0.6)); line-height: 1; }
    .hud-bar-wrap {
      width: 180px; height: 18px;
      background: rgba(0,0,0,0.55);
      border: 2px solid rgba(255,255,255,0.25);
      border-radius: 10px; overflow: hidden;
    }
    .hud-bar-fill {
      height: 100%; border-radius: 8px;
      transition: width 0.3s ease-out, background 0.3s;
      background: linear-gradient(180deg, #66ff66 0%, #33cc33 100%);
      box-shadow: inset 0 -2px 4px rgba(0,0,0,0.3), 0 0 8px rgba(76,175,80,0.4);
    }
    .hud-bar-fill.hp-medium {
      background: linear-gradient(180deg, #ffcc00 0%, #ff9900 100%);
      box-shadow: inset 0 -2px 4px rgba(0,0,0,0.3), 0 0 8px rgba(255,165,0,0.4);
    }
    .hud-bar-fill.hp-low {
      background: linear-gradient(180deg, #ff5555 0%, #cc0000 100%);
      box-shadow: inset 0 -2px 4px rgba(0,0,0,0.3), 0 0 8px rgba(255,0,0,0.5);
    }
    .hud-hp-text { font-size: 12px; color: #fff; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); white-space: nowrap; }
    .hud-level-row { display: flex; align-items: center; gap: 8px; }
    .hud-level-badge { font-size: 14px; font-weight: bold; color: #ffd700; text-shadow: 0 0 6px rgba(255,215,0,0.5), 1px 1px 2px rgba(0,0,0,0.8); white-space: nowrap; }
    .hud-exp-wrap { width: 140px; height: 10px; background: rgba(0,0,0,0.55); border: 1px solid rgba(170,221,255,0.3); border-radius: 6px; overflow: hidden; }
    .hud-exp-fill { height: 100%; border-radius: 5px; transition: width 0.3s ease-out; background: linear-gradient(180deg, #88ccff 0%, #4488cc 100%); box-shadow: inset 0 -1px 3px rgba(0,0,0,0.3), 0 0 6px rgba(68,136,204,0.4); }
    .hud-exp-text { font-size: 11px; color: #aaddff; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); white-space: nowrap; }

    /* Controls hint */
    #controls-hint {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      z-index: 100; pointer-events: none;
      font-family: 'Courier New', monospace; font-size: 12px;
      color: rgba(170,170,170,0.7); text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
      white-space: nowrap;
    }

    /* �T�T�T Inventory overlay �T�T�T */
    #inventory-overlay {
      position: absolute; inset: 0;
      z-index: 200;
      display: none;
      align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.55);
      font-family: 'Courier New', monospace;
    }
    #inventory-overlay.open { display: flex; }

    #inventory-panel {
      background: linear-gradient(135deg, #1e1e3a 0%, #16213e 100%);
      border: 2px solid rgba(255, 215, 0, 0.5);
      border-radius: 12px;
      padding: 20px 24px;
      min-width: 380px;
      max-width: 440px;
      box-shadow: 0 0 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
      position: relative;
    }

    #inventory-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 10px;
    }
    #inventory-title {
      font-size: 18px; font-weight: bold; color: #ffd700;
      text-shadow: 0 0 8px rgba(255,215,0,0.3);
    }
    #inventory-close-hint {
      font-size: 11px; color: #888;
    }

    #inventory-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }

    .inv-slot {
      width: 52px; height: 52px;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      position: relative;
      cursor: default;
      transition: border-color 0.15s, background 0.15s;
    }
    .inv-slot.has-item {
      cursor: pointer;
      border-color: rgba(255,255,255,0.25);
    }
    .inv-slot.has-item:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,215,0,0.6);
    }

    .inv-slot-icon {
      font-size: 24px;
      line-height: 1;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));
    }

    .inv-slot-qty {
      position: absolute; bottom: 2px; right: 4px;
      font-size: 10px; font-weight: bold;
      color: #fff;
      text-shadow: 1px 1px 1px rgba(0,0,0,0.9);
    }

    .inv-slot-rarity {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 3px;
      border-radius: 0 0 5px 5px;
    }

    /* Tooltip */
    #inv-tooltip {
      display: none;
      position: absolute;
      background: rgba(10, 10, 30, 0.95);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 10px 12px;
      min-width: 180px;
      max-width: 240px;
      z-index: 300;
      pointer-events: none;
      font-family: 'Courier New', monospace;
    }
    #inv-tooltip.show { display: block; }
    #inv-tooltip-name { font-size: 13px; font-weight: bold; margin-bottom: 4px; }
    #inv-tooltip-desc { font-size: 11px; color: #aaa; line-height: 1.4; }
    #inv-tooltip-action { font-size: 10px; color: #888; margin-top: 6px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 5px; }

    /* Item pickup toast */
    #pickup-toast {
      position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);
      z-index: 150; pointer-events: none;
      font-family: 'Courier New', monospace;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .pickup-msg {
      font-size: 13px; color: #fff;
      text-shadow: 0 0 6px rgba(0,0,0,0.8);
      opacity: 1;
      transition: opacity 0.5s, transform 0.5s;
      white-space: nowrap;
    }
    .pickup-msg.fade-out {
      opacity: 0;
      transform: translateY(-10px);
    }
  </style>
  <script type="module" crossorigin src="/assets/index-ou4JO00V.js"></script>
</head>
<body>
  <div id="game-container">
    <!-- HUD (always visible) -->
    <div id="hud-overlay">
      <div class="hud-hp-section">
        <span class="hud-heart">??</span>
        <div class="hud-bar-wrap">
          <div class="hud-bar-fill" id="hp-bar" style="width:100%"></div>
        </div>
        <span class="hud-hp-text" id="hp-text">100 / 100</span>
      </div>
      <div class="hud-level-row">
        <span class="hud-level-badge" id="level-text">Lv.1</span>
        <div class="hud-exp-wrap">
          <div class="hud-exp-fill" id="exp-bar" style="width:0%"></div>
        </div>
        <span class="hud-exp-text" id="exp-text">0 / 50</span>
      </div>
    </div>

    <!-- Inventory toggle hint -->
    <div id="controls-hint">Move: WASD/Arrows | Attack: Space/Z | Inventory: B</div>

    <!-- Inventory panel -->
    <div id="inventory-overlay">
      <div id="inventory-panel">
        <div id="inventory-header">
          <span id="inventory-title">?? Inventory</span>
          <span id="inventory-close-hint">[B] Close</span>
        </div>
        <div id="inventory-grid"></div>
      </div>
    </div>

    <!-- Tooltip (lives inside overlay so it can position relative to panel) -->
    <div id="inv-tooltip">
      <div id="inv-tooltip-name"></div>
      <div id="inv-tooltip-desc"></div>
      <div id="inv-tooltip-action"></div>
    </div>

    <!-- Pickup toast -->
    <div id="pickup-toast"></div>
  </div>

</body>
</html>
